<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF9F6">
  <title>CONNECT AI HQ · 삶과 AI 일의 최적화</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="side-top">
        <a class="brand" href="#home">
          <div class="brand-row">
            <img class="brand-crest" src="/assets/hq-crest.png" alt="CONNECT AI HQ">
            <b>CONNECT AI HQ</b>
            <span class="brand-ver">v2</span>
          </div>
          <span id="brand-sub"></span>
        </a>
        <button type="button" class="btn sm mob-set" id="mob-set">설정</button>
      </div>
      <nav class="nav" id="nav" aria-label="메뉴"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <main><div class="page" id="page"></div></main>
  </div>
  <div class="live-dock" id="live-dock" aria-live="polite" aria-label="실시간 알림"></div>
  <div class="live-worker" id="live-worker" aria-live="polite"></div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="dlg"></dialog>
  <script src="/sound.js"></script>
  <script src="/pixel-crew.js"></script>
  <script src="/charts.js"></script>
  <script src="/hidden.js"></script>
  <script src="/app.js"></script>
</body>
</html>
